<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Electric Fields Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one question per screen in a single phone-width column. Round 1 answers are
   entered like a numerical response (a.bc x 10^d, unit, direction); round 2 is A to D. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #17212b;
  --muted: #586675;
  --line: #cfd6dd;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --accent-soft: #dde9f2;
  --good: #1d6b45;
  --good-soft: #dff0e6;
  --warn: #8a5a00;
  --warn-soft: #f6ead0;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161c; --surface: #19222b; --ink: #e6ecf1; --muted: #9aa8b5; --line: #2f3c48;
    --accent: #7db8e0; --accent-ink: #0c1620; --accent-soft: #1f3344;
    --good: #7fd0a2; --good-soft: #17322a; --warn: #e5b85c; --warn-soft: #3a2f16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161c; --surface: #19222b; --ink: #e6ecf1; --muted: #9aa8b5; --line: #2f3c48;
  --accent: #7db8e0; --accent-ink: #0c1620; --accent-soft: #1f3344;
  --good: #7fd0a2; --good-soft: #17322a; --warn: #e5b85c; --warn-soft: #3a2f16;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-inline: 16px; padding-block: 16px 40px;
}
#app { max-width: 34rem; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 1.5rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0; }
p { margin: 0; }
sup { font-size: 0.7em; line-height: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }

.top { display: flex; align-items: center; gap: 12px; }
.top .count { font-family: var(--font-data); font-size: 0.875rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.source { font-size: 0.8125rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.tag { display: inline-block; font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.stem { color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }
.question { font-size: 1.125rem; }
.fig { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); }
.fig svg { display: block; max-width: 100%; height: auto; margin-inline: auto; }
.fig text { font-family: var(--font-data); font-size: 13px; fill: var(--ink); }
.fig .fine { stroke: var(--muted); stroke-width: 1; fill: none; }
.fig .dot { fill: var(--ink); }
.fig .onink { fill: var(--surface); font-size: 20px; font-weight: 600; }

label.lab, .lab { font-size: 0.8125rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
.entry { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: var(--font-data); font-size: 1.125rem; }
.entry input {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 10px; min-width: 0;
}
.entry input#mant { width: 6.5ch; flex: 1 1 6.5ch; max-width: 9ch; }
.entry input#expo { width: 4.5ch; }
.entry .times { white-space: nowrap; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sign { font-family: var(--font-data); width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-family: var(--font-data); font-size: 1rem;
}
.chip.word { font-family: var(--font-body); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; gap: 12px; align-items: baseline; text-align: left; width: 100%;
  min-height: 48px; padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface);
}
.opt b { font-family: var(--font-data); font-weight: 600; }
.opt span { min-width: 0; }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt[disabled] { color: var(--muted); text-decoration: line-through; cursor: not-allowed; background: transparent; }
.primary {
  min-height: 52px; width: 100%; border: 0; border-radius: var(--r);
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.0625rem;
}
.primary[disabled] { opacity: 0.45; cursor: not-allowed; }
.ghost { min-height: 44px; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--line); background: transparent; }
.link { border: 0; background: none; padding: 8px 0; color: var(--muted); text-decoration: underline; font-size: 0.875rem; text-align: left; }

.round { display: flex; flex-direction: column; gap: 10px; }
.round .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.round .status { font-family: var(--font-data); font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.round .status.done { color: var(--good); }

.result { border-radius: var(--r); padding: 12px 14px; }
.result.good { background: var(--good-soft); color: var(--good); }
.result.miss { background: var(--warn-soft); color: var(--warn); }
.result strong { font-weight: 700; }
.parts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.9375rem; margin-top: 4px; }
.hint { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; background: var(--accent-soft); }
.hint .lab { margin-bottom: 2px; }
.answer { font-family: var(--font-data); font-weight: 600; }
.err { color: var(--warn); font-size: 0.9375rem; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat b { display: block; font-family: var(--font-data); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.8125rem; color: var(--muted); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 400; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; }
textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px; width: 100%; min-height: 4.5rem; resize: vertical;
}
textarea.log { font-family: var(--font-data); font-size: 0.75rem; min-height: 10rem; white-space: pre; }
ol.plain { margin: 0; padding-left: 1.25rem; display: flex; flex-direction: column; gap: 6px; }
.today { border-color: var(--accent); border-width: 2px; }
h2.sub { font-size: 0.8125rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 400; margin-top: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9375rem; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.fig .mk { fill: var(--muted); }
.testbar { background: var(--warn-soft); color: var(--warn); border: 1px dashed var(--warn); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 0.9375rem; }
.testbar .ghost { border-color: var(--warn); color: var(--warn); }
.video { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--accent); text-decoration: none; }
.video span { color: var(--muted); font-size: 0.875rem; }
</style>

</head>
<body>
<main id="app" aria-live="polite"></main>

<script>
(function () {
  "use strict";

  var UNITS = ["N/C", "V/m", "N", "V", "C", "J", "m", "m/s²", "m/s", "no unit"];
  var DIRS = ["left", "right", "up", "down"];
  var HINT_LABELS = ["What it's asking", "The idea", "The setup", "First step"];

  var TOL = 0.01; // within 1% of the key, i.e. the same answer to three significant digits

  var FIG46 =
    '<svg viewBox="0 0 320 112" role="img" aria-label="Particle I, negative, on the left and particle II, positive, on the right, 9.0 cm apart">' +

    '<path class="fine" stroke-dasharray="3 4" d="M160 46 V114 M160 126 V194 M86 200 H154 M166 200 H234"></path>' +
    '<circle class="dot" cx="160" cy="40" r="5"></circle><circle class="dot" cx="160" cy="120" r="5"></circle>' +
    '<circle class="dot" cx="80" cy="200" r="5"></circle><circle class="dot" cx="240" cy="200" r="5"></circle>' +
    '<circle class="fine" cx="160" cy="200" r="4"></circle>' +
    '<text x="172" y="44">q₁ = −12 µC</text><text x="172" y="124">q₂ = +3.0 µC</text>' +
    '<text x="148" y="84" text-anchor="end">1.0 m</text><text x="148" y="164" text-anchor="end">1.0 m</text>' +
    '<text x="80" y="186" text-anchor="middle">+5.0 µC</text><text x="240" y="186" text-anchor="middle">+5.0 µC</text>' +
    '<text x="80" y="222" text-anchor="middle">q₃</text><text x="240" y="222" text-anchor="middle">q₄</text>' +
    '<text x="160" y="222" text-anchor="middle" font-weight="600">P</text>' +
    '<text x="120" y="240" text-anchor="middle">1.0 m</text><text x="200" y="240" text-anchor="middle">1.0 m</text></svg>';

  // Numbers and question numbers are the teacher's. Wording, diagrams and hints are Claude's.
  // Round 1 key: worked by Claude. Round 2 key: the teacher's (notes p. 47), re-worked by Claude.
  var ITEMS = [
    { r: 0, q: "1", page: 39, kind: "Field of a point charge",
      text: "A 1.00 C charge sits at a point. Find the strength and direction of the electric field 0.250 m to its right.",
      value: 1.4384e11, show: ["1.44", 11], units: ["N/C"], dir: "right",
      hints: ["You want the field's strength at one point, and which way it points there. There is no second charge.",

      text: "Find the strength and direction of the electric field 8.50 cm to the left of a 300 µC charge.",
      value: 3.7329e8, show: ["3.73", 8], units: ["N/C"], dir: "left",
      hints: ["Same kind as the last one: strength and direction at a point 8.50 cm to the left of one positive charge.",
              "Point-charge field again. Both given values need converting to base units before you use them.",

    { r: 0, q: "5", page: 40, kind: "Field from a force",
      text: "An electron feels a net force of 6.50 x 10^-16 N to the right. Find the size and direction of the electric field it is in.",

    { r: 0, q: "8", page: 40, kind: "Net field, charges in a line",

      hints: ["Two charges in a line. You want the total field at the point halfway between them, with a direction.",

              "Use E = kq / r² twice. Each r runs from that charge to the midpoint, not from one charge to the other.",

      text: "Three charges lie on a line. The first is 2.50 x 10^-2 C. The second, −4.00 x 10^-2 C, is 60.0 mm to the right of the first. The third, 3.00 x 10^-2 C, is 5.00 cm to the right of the second. Find the strength and direction of the net field 2.00 cm to the right of the third charge.",
      value: 6.1416e11, show: ["6.14", 11], units: ["N/C"], dir: "right",

              "E = kq / r² three times. Each r runs from that charge to the point.",

    { r: 0, q: "10", page: 41, kind: "Parallel plates",
      text: "Two parallel plates are 360 cm apart with a potential difference of 200 V between them. Find the size of the electric field between the plates.",
      value: 55.556, show: ["55.6", 0], units: ["V/m", "N/C"], dir: null,
      hints: ["Parallel plates. You want only the size of the field between them.",
              "Between parallel plates the field is uniform, so the point-charge equation doesn't apply here.",
              "E = ΔV / d, with d in metres.",
              "Convert first: 360 cm = 3.60 m."] },
    { r: 0, q: "12a", page: 41, kind: "Parallel plates", stem: STEM12,
      text: "Find the potential difference across the plates.",
      value: 250, show: ["250", 0], units: ["V"], dir: null,
      hints: ["You have the field and the plate spacing, and you want the potential difference across the plates.",
              "A uniform field ties together field, voltage and spacing.",
              "ΔV = E d, with d in metres.",
              "10.0 cm = 0.100 m."] },
    { r: 0, q: "12b", page: 41, kind: "Force from a field", stem: STEM12,
      text: "Find the size of the electric force on the electron.",

      hints: ["You want the size of the electric force on the electron sitting in that field.",

              "F = qE, with the elementary charge.",
              "1.60 x 10^-19 x 2.50 x 10^3."] },
    { r: 0, q: "12c", page: 41, kind: "Force to acceleration", stem: STEM12,
      text: "Find the electron's acceleration.",
      value: 4.3908e14, show: ["4.39", 14], units: ["m/s²"], dir: null,
      hints: ["You want the electron's acceleration caused by the electric force on it.",
              "Newton's second law, with the electron's mass from the data booklet.",
              "a = F / m.",
              "First the force: F = qE = 1.60 x 10^-19 x 2.50 x 10^3. Then divide by m = 9.11 x 10^-31 kg."] },

    { r: 1, q: "46", page: 41, kind: "Direction of a net field", fig: FIG46,
      stem: "Two particles of equal mass sit 9.0 cm apart. Particle I, on the left, is negative. Particle II, on the right, is positive. The charge on I is three times the size of the charge on II.",

  /* ---------- small helpers ---------- */
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  function logText() {

    h += '<p class="question">' + fmt(it.text) + "</p>";
    if (C.review && !mc) h += '<p class="muted small">This is today’s paper question. Work it out in full before you enter anything.</p>';
    h += "</div>";

    if (!st.done) {
      h += '<div class="panel stack">';
      if (mc) {
        h += '<div><span class="lab">Your answer</span><div class="opts" id="opts">' + it.options.map(function (o, k) {
               var tried = st.tried.indexOf(k) >= 0;
               return '<button type="button" class="opt" data-o="' + k + '" aria-pressed="' + (st.pick === k) + '"' + (tried ? " disabled" : "") + "><b>" + LETTERS[k] + ".</b><span>" + fmt(o) + "</span></button>"; }).join("") + "</div></div>";
      } else {
        h += '<div><label class="lab" for="mant">Your answer</label><div class="entry">' +
             '<input id="mant" inputmode="decimal" autocomplete="off" placeholder="a.bc" value="' + esc(st.m) + '">' +
             '<span class="times">× 10^</span>' +
             '<button class="sign" id="sign" type="button" aria-label="Exponent sign, now ' + (st.neg ? "negative" : "positive") + '">' + (st.neg ? "−" : "+") + "</button>" +
             '<input id="expo" inputmode="numeric" autocomplete="off" placeholder="d" value="' + esc(st.e) + '" aria-label="Power of ten">' +
             "</div><p class=\"muted small\" style=\"margin-top:6px\">Leave the power blank for an ordinary number.</p></div>";
        h += '<div><span class="lab">Unit</span><div class="chips" id="units">' + UNITS.map(function (u) {
               return '<button type="button" class="chip' + (u === "no unit" ? " word" : "") + '" data-u="' + esc(u) + '" aria-pressed="' + (st.unit === u) + '">' + esc(u) + "</button>"; }).join("") + "</div></div>";
        if (it.dir) h += '<div><span class="lab">Direction</span><div class="chips" id="dirs">' + DIRS.map(function (d) {
               return '<button type="button" class="chip word" data-d="' + d + '" aria-pressed="' + (st.dir === d) + '">' + d + "</button>"; }).join("") + "</div></div>";
      }
      if (st.err) h += '<p class="err" role="alert">' + esc(st.err) + "</p>";
      h += "</div>";

      if (st.wrong > 0) {
        h += '<div class="result miss" id="result"><strong>Not yet.</strong>';
        if (!mc && st.parts) h += '<div class="parts">' +
             "<span>Number: " + (st.parts.num ? "matches" : "doesn’t match") + "</span>" +
             "<span>Unit: " + (st.parts.unit ? "matches" : "doesn’t match") + "</span>" +
             (it.dir ? "<span>Direction: " + (st.parts.dir ? "matches" : "doesn’t match") + "</span>" : "") + "</div>";
        h += "</div>";
      }
      h += hintsHtml(it, st, true);
      if (st.wrong > 0) h += videoHtml(it, st);
      h += '<button class="primary" id="check" type="button">' + (st.wrong > 0 ? "Check again" : "Check") + "</button>";
      if (!mc && st.wrong > 4) h += '<button class="ghost" id="reveal" type="button">Show the answer and move on</button>';
    } else {
      if (st.solved) {
        h += '<div class="result good" id="result"><strong>Right' + (st.wrong === 0 ? ", first time." : ".") + '</strong> <span class="answer">' + answerHtml(it) + "</span>" +
             (it.note ? '<p class="small" style="margin-top:4px">' + fmt(it.note) + "</p>" : "") + "</div>";
      } else {
        h += '<div class="result miss" id="result"><strong>Answer:</strong> <span class="answer">' + answerHtml(it) + "</span><p class=\"small\" style=\"margin-top:4px\">This one comes back tomorrow so you can try it again.</p></div>";
      }
      h += hintsHtml(it, st, false);
      h += videoHtml(it, st);
      if (st.wrong > 0) {
        h += '<div class="panel stack"><span class="lab" style="margin:0">What tripped you up?</span><div class="chips" id="slips">' + SLIPS.map(function (s) {
             return '<button type="button" class="chip word" data-s="' + s + '" aria-pressed="' + (st.slip === s) + '">' + s + "</button>"; }).join("") + "</div></div>";
      }
      var last = C.review ? C.pos === C.n - 1 : !roundIdx(it.r).some(function (k) { return !state.items[k].done; });
      h += '<button class="primary" id="next" type="button"' + (st.wrong > 0 && !st.slip ? " disabled" : "") + ">" +
           (!last ? "Next question" : C.review ? "Finish today’s review" : "Finish round " + (it.r + 1)) + "</button>";
      h += '<button class="link" id="flag" type="button">' + (st.flag ? "Flagged: you think the key is wrong. Tap to undo." : "I think the key is wrong on this one") + "</button>";
    }
    h += '<button class="link" id="home" type="button">Back to the start</button>';
    paint(h);

    var mant = document.getElementById("mant"), expo = document.getElementById("expo");
    if (mant) mant.oninput = function () { st.m = mant.value; save(); };
    if (expo) expo.oninput = function () { st.e = expo.value.replace(/[^0-9]/g, ""); if (st.e !== expo.value) expo.value = st.e; save(); };
    on("sign", function () { st.neg = !st.neg; save(); render(); });
    pick("units", "u", function (v) { st.unit = v; });
    pick("dirs", "d", function (v) { st.dir = v; });
    pick("slips", "s", function (v) { st.slip = v; });
    pick("opts", "o", function (v) { st.pick = parseInt(v, 10); });
    on("check", check); on("reveal", reveal); on("next", next);
    on("flag", function () { st.flag = !st.flag; save(); render(); });
    on("home", goHome);
    var vid = document.getElementById("video");
    if (vid) vid.addEventListener("click", function () { st.video = true; save(); });
    function pick(id, attr, set) {
      var box = document.getElementById(id);
      if (!box) return;
      box.onclick = function (ev) {
        var b = ev.target.closest ? ev.target.closest("button") : null;
        if (!b || b.disabled) return;
        set(b.getAttribute("data-" + attr)); st.err = ""; save(); render();
      };
    }
  }

  function renderEnd() {
    var all = entries(), f = 0, hinted = 0, shown = 0, slips = {}, rows = "";
    all.forEach(function (e) {
      if (e.first) f++; else if (e.solved) hinted++; else shown++;
      if (e.wrong > 0 && e.slip) slips[e.slip] = (slips[e.slip] || 0) + 1;
    });
    all.slice(-40).reverse().forEach(function (e) {
      rows += "<tr><td>" + ymd(e.at).slice(5) + "</td><td>" + (e.it.src === "ws" ? "sheet " : "notes ") + esc(e.it.q) + "</td><td>" + e.it.t + "</td><td>" + esc(e.it.kind) + "</td><td>" + (e.first ? "first time" : e.solved ? "after hints" : "shown") + "</td><td>" + e.hints + "</td><td>" + (e.wrong > 0 ? esc(e.slip || "-") : "-") + "</td></tr>";
    });
    var slipLine = Object.keys(slips).map(function (k) { return k + " ×" + slips[k]; }).join(", ");
    var qs = ["Which question felt different after the hint, and why?",
              "More or less useful than your usual way of studying for a quiz?",
              "Would you do ten minutes of this on a normal day?"];
    var h = '<p class="source">Electricity · your log</p><h1>Where you are so far</h1>';
    h += '<div class="stats"><div class="stat"><b>' + f + '</b><span>right first time</span></div><div class="stat"><b>' + hinted + '</b><span>right after hints</span></div><div class="stat"><b>' + shown + "</b><span>answer shown</span></div></div>";
    h += '<p class="muted">Review sessions in the last 7 days: ' + sessionsLast7() + "." + (slipLine ? " Where the misses came from: " + esc(slipLine) + "." : "") + "</p>";
    h += '<div class="panel scroll"><table><thead><tr><th>Date</th><th>Q</th><th>Topic</th><th>Kind</th><th>Result</th><th>Hints</th><th>Slip</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
    h += '<button class="primary" id="home" type="button">Back to the start</button>';
    h += '<div class="panel stack"><h2>Three questions, in your own words</h2>';
    qs.forEach(function (q, k) { h += '<div><label class="lab" for="note' + k + '" style="text-transform:none;letter-spacing:0;font-size:1rem;color:inherit">' + (k + 1) + ". " + esc(q) + '</label><textarea id="note' + k + '">' + esc(state.notes[k]) + "</textarea></div>"; });
    h += "</div>";
    h += '<button class="ghost" id="copy" type="button">Copy my log</button>';
    if (state.copied) h += '<p class="muted" role="status">' + esc(state.copied) + "</p>";
    h += '<textarea class="log" id="logbox" readonly aria-label="Your log">' + esc(logText()) + "</textarea>";
    h += '<p class="muted small">Nothing is sent anywhere. The log leaves this device only if you copy it and pass it on.</p>';
    h += state.confirmReset
      ? '<div class="row"><span>Clear every answer and the review schedule?</span><button class="ghost" id="yes" type="button">Yes, clear</button><button class="ghost" id="no" type="button">Keep them</button></div>'
      : '<button class="link" id="reset" type="button">Start over</button>';
    paint(h);
    qs.forEach(function (q, k) {
      var ta = document.getElementById("note" + k);
      ta.oninput = function () { state.notes[k] = ta.value; save(); var lb = document.getElementById("logbox"); if (lb) lb.value = logText(); };
    });
    on("copy", copyLog); on("home", goHome);
    on("reset", function () { state.confirmReset = true; render(); });
    on("no", function () { state.confirmReset = false; render(); });
    on("yes", function () { state = fresh(); save(); render(); window.scrollTo(0, 0); });
  }

  load();
  render();
})();
</script>
</body>
</html>
