<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Social 30-1 Test 3 Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* One card per screen in a phone-width column, same look as the Electricity page.
   Recall cards: say it, reveal, mark yourself. Multiple choice: pick, check.
   Spectrum cards: tap the box each name belongs in. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #17212b;
  --muted: #586675;
  --line: #cfd6dd;
  --accent: #1f5f8b;
  --accent-ink: #ffffff;
  --accent-soft: #dde9f2;
  --good: #1d6b45;
  --good-soft: #dff0e6;
  --warn: #8a5a00;
  --warn-soft: #f6ead0;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161c; --surface: #19222b; --ink: #e6ecf1; --muted: #9aa8b5; --line: #2f3c48;
    --accent: #7db8e0; --accent-ink: #0c1620; --accent-soft: #1f3344;
    --good: #7fd0a2; --good-soft: #17322a; --warn: #e5b85c; --warn-soft: #3a2f16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161c; --surface: #19222b; --ink: #e6ecf1; --muted: #9aa8b5; --line: #2f3c48;
  --accent: #7db8e0; --accent-ink: #0c1620; --accent-soft: #1f3344;
  --good: #7fd0a2; --good-soft: #17322a; --warn: #e5b85c; --warn-soft: #3a2f16;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-inline: 16px; padding-block: 16px 40px;
}
#app { max-width: 34rem; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 1.5rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }

.top { display: flex; align-items: center; gap: 12px; }
.top .count { font-family: var(--font-data); font-size: 0.875rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.source { font-size: 0.8125rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.tag { display: inline-block; font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.tag.blue { background: var(--accent-soft); color: var(--accent); }
.stem { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; font-size: 0.9375rem; }
.stem .lab { margin-bottom: 4px; }
.question { font-size: 1.125rem; }
.current { font-size: 1.25rem; }

.lab { font-size: 0.8125rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; gap: 12px; align-items: baseline; text-align: left; width: 100%;
  min-height: 48px; padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface);
}
.opt b { font-family: var(--font-data); font-weight: 600; }
.opt span { min-width: 0; }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.is-right { background: var(--good-soft); color: var(--ink); border: 2px solid var(--good); }
.opt.is-wrong { background: var(--warn-soft); color: var(--ink); border: 2px solid var(--warn); }
.primary {
  min-height: 52px; width: 100%; border: 0; border-radius: var(--r);
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.0625rem;
}
.primary[disabled] { opacity: 0.45; cursor: not-allowed; }
.ghost { min-height: 44px; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--line); background: transparent; }
.link { border: 0; background: none; padding: 8px 0; color: var(--muted); text-decoration: underline; font-size: 0.875rem; text-align: left; }
.marks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.marks button { min-height: 52px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.marks .m-got { border-color: var(--good); color: var(--good); }
.marks .m-miss { border-color: var(--warn); color: var(--warn); }

.round { display: flex; flex-direction: column; gap: 10px; }
.round .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.round .status { font-family: var(--font-data); font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.round .status.done { color: var(--good); }
.today { border-color: var(--accent); border-width: 2px; }
h2.sub { font-size: 0.8125rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 400; margin-top: 8px; }

.result { border-radius: var(--r); padding: 12px 14px; }
.result.good { background: var(--good-soft); color: var(--good); }
.result.miss { background: var(--warn-soft); color: var(--warn); }
.result.plain { background: var(--accent-soft); color: var(--ink); }
.result p + p { margin-top: 6px; }
.why { color: var(--ink); font-size: 0.9375rem; margin-top: 6px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9375rem; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px; width: 100%; min-height: 6rem; resize: vertical;
}
textarea.log { font-family: var(--font-data); font-size: 0.75rem; min-height: 10rem; white-space: pre; }
ol.plain, ul.plain { margin: 0; padding-left: 1.25rem; display: flex; flex-direction: column; gap: 6px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat b { display: block; font-family: var(--font-data); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.8125rem; color: var(--muted); }
.testbar { background: var(--warn-soft); color: var(--warn); border: 1px dashed var(--warn); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 0.9375rem; }
.testbar .ghost { border-color: var(--warn); color: var(--warn); }

/* Spectrum and chart */
.spec { display: flex; flex-direction: column; gap: 6px; }
.ends { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.875rem; }
.arrow { position: relative; height: 6px; background: var(--ink); margin: 4px 14px; }
.arrow::before, .arrow::after { content: ""; position: absolute; top: 50%; transform: translateY(-50%); border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.arrow::before { left: -14px; border-right: 14px solid var(--ink); }
.arrow::after { right: -14px; border-left: 14px solid var(--ink); }
.specsvg { display: block; width: 100%; height: auto; }
.specsvg .main { fill: var(--ink); }
.specsvg .hollow { fill: var(--surface); stroke: var(--muted); stroke-width: 2; vector-effect: non-scaling-stroke; }
.specsvg text { fill: var(--muted); font-style: italic; font-size: 30px; font-family: var(--font-body); }
.chg { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
.chg .arrow { height: 3px; margin: 2px 10px; }
.chg .arrow::before, .chg .arrow::after { border-top-width: 6px; border-bottom-width: 6px; }
.chg .arrow::before { left: -10px; border-right-width: 10px; }
.chg .arrow::after { right: -10px; border-left-width: 10px; }
.chg-lcr { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); padding: 0 6px; font-style: italic; }
.chg-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; text-align: center; font-size: 0.75rem; line-height: 1.2; font-style: italic; }
.chg-row span { padding: 3px 1px; border: 2px solid transparent; border-radius: 6px; overflow-wrap: anywhere; }
.panel .chg-row { font-size: 0.6875rem; }
.chg-row span.hl { border-color: var(--accent); font-weight: 700; font-style: normal; }
.paper { background: #fbfaf6; color: #1b1b1b; border: 1px solid #d9d4c7; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.paper svg { display: block; width: 100%; height: auto; }
.paper h3 { font-size: 0.8125rem; margin: 0; font-weight: 700; }
.paper .note { font-size: 0.75rem; color: #5b6670; }
.zones { display: grid; gap: 6px; }
.scan { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.scanwrap { position: relative; background: #ffffff; border: 1px solid #d9d4c7; border-radius: 6px; padding: 6px; }
.scanwrap img { display: block; width: 100%; height: auto; }
.scanwrap .mask { position: absolute; background: #ffffff; border: 2px dashed #1f5f8b; border-radius: 4px; color: #1f5f8b; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 0.9375rem; }
.scan figcaption { font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.ends .blank { min-width: 7ch; text-align: center; border-bottom: 2px dashed var(--accent); color: var(--accent); }
.zones.z4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.zones.z3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.zone {
  display: flex; flex-direction: column; gap: 4px; text-align: left; min-height: 92px; padding: 8px 6px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  font-size: 0.75rem; line-height: 1.25; overflow-wrap: anywhere; hyphens: manual; -webkit-hyphens: manual; color: var(--ink);
}
button.zone { border-color: var(--accent); border-style: dashed; }
button.zone:active { background: var(--accent-soft); }
.zone .zt { font-weight: 700; }
.zone .zs { color: var(--muted); font-size: 0.6875rem; }
.zone .who { display: flex; flex-direction: column; gap: 3px; margin-top: auto; padding-top: 4px; }
.zone .who span { background: var(--accent-soft); border-radius: 4px; padding: 2px 3px; overflow-wrap: normal; }
.panel .zone { padding: 8px 4px; }
.panel .zone .who span { font-size: 0.6875rem; }
.zone .who span.also { background: transparent; color: var(--muted); padding: 0 4px; }
.zone.right { border: 2px solid var(--good); background: var(--good-soft); }
.zone.wrong { border: 2px solid var(--warn); background: var(--warn-soft); }
.cols { display: flex; flex-direction: column; gap: 8px; }
.col { border-left: 3px solid var(--line); padding-left: 10px; font-size: 0.875rem; }
.col b { display: block; font-size: 0.9375rem; }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; }
td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { font-family: var(--font-data); white-space: nowrap; font-variant-numeric: tabular-nums; }
</style>
</head>

  var I = {

    "s1-open": { t: "recall", src: "Package p.19", k: "Ends of the p.19 spectrum", specFig: true,
      q: "Easy one to start. Here’s the page 19 spectrum with its two ends hidden. What goes at the far left, and what goes at the far right?",
      a: "<b>Collectivism</b> on the left. <b>Individualism</b> on the right." },
    "s1-place": { t: "place", layout: "spec", src: "Package p.19", k: "Place names on the p.19 spectrum",
      q: "Put each one where it sits on the page 19 spectrum.",
      names: [
        ["Karl Marx", 0, "Marxism and communism: the far collectivist end."],
        ["Adam Smith", 3, "Classical liberalism: the far individualist end. The father of capitalism."],
        ["Robert Owen", 1, "A utopian socialist. He wanted better lives for workers but kept his business."],
        ["Labour unions", 2, "Modern liberalism: groups pushing for workers’ rights inside a liberal system."],

    "s1-socialism": { t: "recall", src: "Package p.17", k: "Socialism: who owns, who benefits",
      q: "Socialism: who should own the means of production, and who should the wealth benefit?",
      a: "The <b>workers, collectively</b>. Wealth is shared <b>equitably</b> for the benefit of all of society (<b>collectivism</b>, the <b>common good</b>) through <b>redistribution of wealth</b>." },
    "s1-demsoc": { t: "mc", src: "Package p.17", k: "Democratic socialism",
      q: "Which of these describes democratic socialism?",
      opts: ["Some private ownership, but heavy government intervention and a welfare state", "No private property; government planners run the whole economy", "Small government; the free market decides almost everything", "Business owners give workers pensions so they won’t form unions"], ans: 0,
      why: "Democratic socialism keeps some private ownership but uses <b>safety nets</b> and a <b>welfare state</b>, paid for with higher taxes, to <b>reduce economic disparity</b>. No private property is communism; small government is classical liberalism; pensions to keep unions out is welfare capitalism." },
    "s1-cradle": { t: "recall", src: "Package p.17", k: "Cradle to grave economics",
      q: "What is “cradle to grave” economics, and how is it mainly paid for?",
      a: "The government provides for citizens <b>from birth until death</b>. It’s paid for mainly through <b>progressive taxation</b> (the more you earn, the higher the rate you pay)." },
    "s1-marx3": { t: "mc", src: "Package p.19 · Personalities slide 12", k: "Marx’s three goals",
      q: "Which were Karl Marx’s three main goals?",
      opts: ["A classless society, economic equality and humanitarianism", "Free trade, private property and competition", "Tradition, slow change and rule by the educated elite", "A secret ballot, equal districts and yearly elections"], ans: 0,
      why: "The other three lists belong to Adam Smith, Edmund Burke and the Chartists." },
    "s1-classes": { t: "mc", src: "Package p.19", k: "Marx’s two classes",
      q: "Marx said industrial society was a struggle between which two classes?",
      opts: ["The proletariat (workers) and the bourgeoisie (business owners)", "The nobility and the Church", "Farmers and merchants", "The elite and the electorate"], ans: 0,
      why: "The workers did most of the work in the factories while the owners kept the profits. That’s the class struggle." },
    "s1-radical": { t: "mc", src: "Package p.19 · p.13", k: "Marx on the change spectrum", fig: 0,
      q: "On the “desire for change” spectrum, which label fits Karl Marx?",
      opts: ["Radical", "Reactionary", "Liberal", "Conservative"], ans: 0,
      why: "He said a classless society would only come after the workers <b>rose up in a violent revolution</b>: violence to move <b>forward</b> to something new. Reactionaries use violence to go <b>back</b>." },
    "s1-books": { t: "mc", src: "Package p.19 (others p.12–14)", k: "Marx’s book with Engels",
      q: "Which book did Marx write with Friedrich Engels?",
      opts: ["The Communist Manifesto", "The Wealth of Nations", "The Spirit of the Laws", "On Liberty"], ans: 0,
      why: "Marx also wrote <b>Das Kapital</b>. The Wealth of Nations is Adam Smith’s, The Spirit of the Laws is Montesquieu’s, and On Liberty is John Stuart Mill’s." },
    "s1-nationalize": { t: "mc", src: "Package p.19", k: "Marx’s method",
      q: "How did Marx want to take control of the economy?",
      opts: ["Abolish private property and nationalize the means of production", "Cut taxes and let the market decide", "Give businesses tax breaks so wealth trickles down", "Let business owners add pensions and shorter hours"], ans: 0,
      why: "<b>Centralize, regulate and nationalize</b> the factories so the economy is controlled by the workers." },
    "s1-command": { t: "mc", src: "Package p.19", k: "Command economy",
      q: "In a command economy, who decides what gets made and what it costs?",
      opts: ["Government planners", "Supply and demand", "Businesses competing with each other", "Labour unions"], ans: 0,
      why: "Like the USSR’s <b>Gosplan</b> and its five-year plans; Cuba and North Korea too. In a free market, supply and demand and competition decide." },
    "s1-owen": { t: "mc", src: "Package p.18", k: "Robert Owen and New Lanark",
      q: "Robert Owen’s business at New Lanark is an example of…",
      opts: ["Utopian socialism: better conditions, free schooling and medical care, in a business he still owned", "Communism: the state owned the mill", "Social Darwinism: only the hardest workers survived", "A command economy run by government planners"], ans: 0,
      why: "Owen improved workers’ lives inside a capitalist business. Marx, by contrast, wanted a revolution." },
    "s1-statist": { t: "mc", src: "Package p.19", k: "Statists",
      q: "A statist would most likely support…",
      opts: ["High taxes and central planning of the economy", "Deregulation and tax cuts", "Leaving the economy to the invisible hand", "Letting only the educated elite vote"], ans: 0,
      why: "Statists want <b>big government</b> with a lot of power over the economy and people’s behaviour, and they distrust the free market." },
    "s1-stimulus": { t: "mc", src: "Package p.18", k: "Stimulus packages",
      q: "What is a stimulus package for?",
      opts: ["Government spending to boost jobs and spending and pull the economy out of a recession", "Cutting government spending to balance the budget", "Breaking up monopolies", "Giving workers ownership of the factories"], ans: 0,
      why: "It’s a left-wing idea. Capitalists call it <b>fiscally irresponsible</b> because the borrowing creates <b>deficits</b> for future generations. The right sometimes backs one anyway when it’s badly needed: the spectrum is fluid." },
    "s1-occupy": { t: "recall", src: "Package p.18", k: "Occupy Wall Street",
      q: "Occupy Wall Street (2011): what was it against, and what was its slogan?",
      a: "Corporate greed, social inequality, and the huge gap between rich and poor: <b>economic disparity</b>. Slogan: <b>“We are the 99%.”</b>" },
    "s1-ccf": { t: "mc", src: "Package p.18", k: "The CCF",
      q: "The CCF started in Calgary during the Great Depression. What did it become?",
      opts: ["The NDP", "The Liberal Party", "The Conservative Party", "The Libertarian Party"], ans: 0,
      why: "It won power in <b>Saskatchewan in 1944</b> and became the <b>NDP in 1961</b>." },
    "s1-ubi": { t: "mc", src: "Package p.18", k: "Universal Basic Income",
      q: "A regular payment from the government to citizens, with no strings attached, to help end poverty, is…",
      opts: ["Universal Basic Income", "A stimulus package", "A subsidy", "Progressive taxation"], ans: 0,
      why: "A stimulus package is spending to pull the economy out of a recession. Progressive taxation means higher earners pay a higher rate." },
    "s1-q1a": { t: "mc", src: "Practice quote · Package p.17", k: "Quote 1: the ideology", stem: "Q1",
      q: "Which ideology fits this speaker best?",
      opts: ["Socialism", "Classical liberalism", "Classical conservatism", "Social Darwinism"], ans: 0,
      why: "Workers owning the means of production together and sharing the wealth is <b>socialism</b> (collectivism, the common good)." },
    "s1-q1b": { t: "mc", src: "Practice quote · Package p.19", k: "Quote 1: the thinker", stem: "Q1",
      q: "Which person would most strongly agree with this speaker?",
      opts: ["Karl Marx", "Adam Smith", "Edmund Burke", "Milton Friedman"], ans: 0,
      why: "Marx: the <b>proletariat</b> do the work while the <b>bourgeoisie</b> keep the profits." },
    /* Session 2: how the 1800s pushed back */
    "s2-open": { t: "recall", src: "Package p.15", k: "The term for the rich–poor gap",
      q: "Easy one to start. The Industrial Revolution made some people very rich and left many very poor. What’s the Social Studies term for that gap?",
      a: "<b>Economic disparity.</b> Use that exact term in your answers." },
    "s2-conditions": { t: "mc", src: "Package p.15", k: "Conditions in the 1800s",
      q: "Which of these was NOT a condition of classical liberalism in the 1800s?",
      opts: ["Universal healthcare paid for by the government", "Child labour", "Pollution and city slums", "A growing gap between rich and poor"], ans: 0,
      why: "Government healthcare came much later, with the welfare state. Child labour, worker abuse, pollution, slums and <b>economic disparity</b> were the problems of the 1800s." },
    "s2-barons": { t: "mc", src: "Package p.15", k: "Robber barons",
      q: "Business owners who got rich through ruthless practices and didn’t share with their workers were called…",
      opts: ["Robber barons", "Luddites", "Chartists", "Suffragists"], ans: 0,
      why: "Luddites smashed machines, Chartists pushed Parliament for the vote, and suffragists fought for women’s right to vote." },
    "s2-luddites": { t: "mc", src: "Package p.15 · p.13", k: "Luddites on the change spectrum", fig: 4,
      q: "The Luddites broke into factories and smashed the machines that were replacing them. On the change spectrum, they are…",
      opts: ["Reactionary", "Radical", "Liberal", "Moderate"], ans: 0,
      why: "Reactionaries use violence to go <b>back</b> to the way things used to be. Radicals use violence to move <b>forward</b> to something new, like Marx." },
    "s2-chartism": { t: "mc", src: "Package p.16", k: "Chartism and the People’s Charter",
      q: "Which of these was a demand in the Chartists’ People’s Charter of 1838?",
      opts: ["A secret ballot", "A 10-hour work day", "Votes for women", "Workers owning the factories"], ans: 0,
      why: "The Charter asked for a vote for every <b>man</b> over 21, a <b>secret ballot</b>, equal-sized districts, no requirements to become an MP, and yearly elections. The 10-hour day came from the Factory Acts." },
    "s2-factory": { t: "mc", src: "Package p.16", k: "Factory Acts",
      q: "A 10-hour work day, a 56½-hour week limit and a minimum age for child workers all came from…",
      opts: ["The Factory Acts", "The People’s Charter", "The Square Deal", "The Communist Manifesto"], ans: 0,
      why: "Britain’s Factory Acts protected workers, especially women and children. The minimum age was 9 at first, later 11." },
    "s2-unions": { t: "recall", src: "Package p.16", k: "Labour unions",
      q: "What are labour unions for, and what’s their main tool?",
      a: "<b>Good wages</b>, <b>stopping child labour</b>, and <b>preventing human rights abuses</b>. Their main tool is the <b>strike</b> (a work stoppage). Labour movements also led to the International Labour Organization in 1919." },
    "s2-antiunion": { t: "mc", src: "Package p.16", k: "Capitalist case against unions",

    "s2-vote": { t: "mc", src: "Package p.16–17", k: "Voting rights dates",
      q: "Which set of dates is right?",
      opts: ["Women in Canada 1918 · American women 1920 · Indigenous people in Canada 1960", "Women in Canada 1920 · American women 1918 · Indigenous people in Canada 1960", "Women in Canada 1918 · American women 1920 · Indigenous people in Canada 1982", "Women in Canada 1960 · American women 1920 · Indigenous people in Canada 1918"], ans: 0,
      why: "American women got the vote through the <b>19th Amendment</b> in 1920. The goal was <b>universal suffrage</b>: a vote for every adult." },
    "s2-classcons": { t: "mc", src: "Package p.17", k: "Classical conservatism",

    "s2-burke": { t: "mc", src: "Package p.17 · p.13", k: "Edmund Burke", fig: 3,
      q: "Edmund Burke would most likely support…",

      why: "Burke wanted to keep the <b>status quo</b> and accepted only slow, organic change. He rejected both extremes of the French Revolution." },
    "s2-episto": { t: "mc", src: "Package p.17", k: "Epistocracy",

    "s2-welfcap": { t: "mc", src: "Package p.20", k: "Welfare capitalism",

      why: "It kept the free market but added protections from the <b>business</b> side. It was the first step toward modern liberalism and the welfare state." },
    "s2-square": { t: "recall", src: "Package p.20", k: "The Square Deal",
      q: "The Square Deal: which president, what happened in 1902, and why did it matter?",
      a: "<b>Theodore (Teddy) Roosevelt</b>. He stepped in to settle the <b>Anthracite Coal Strike</b>: the <b>first time a president publicly stepped into a labour dispute</b>, at least implicitly on the <b>workers’ side</b>. The idea was <b>big business and labour unions getting along</b>." },
    "s2-q2a": { t: "mc", src: "Practice quote · Package p.17", k: "Quote 2: the ideology", stem: "Q2",
      q: "Which ideology fits this speaker best?",
      opts: ["Classical conservatism", "Classical liberalism", "Socialism", "Modern liberalism"], ans: 0,

    "s2-q3": { t: "mc", src: "Practice quote · Package p.20", k: "Quote 3: welfare capitalism", stem: "Q3",

    "s4-a1": { t: "recall", src: "Practice source · made up for this page", stem: "A", k: "Source A: the message",

    "s4-a2": { t: "mc", src: "Practice source · Package p.19", stem: "A", k: "Source A: supporter",

    "s4-write": { t: "explain", src: "Practice source A", stem: "A", k: "Source A: supporter and opponent paragraph",

  /* Small single-series line chart drawn like a printed exam graph: one axis, thin line,

    on("tolog", function () { go("log"); });
  }

  function topBar() {
    var run = state.run, S = sessById(run.sid), n = run.q.length;
    var label = run.phase === "extra" ? "Three more" : run.phase === "retry" ? "Second try" : "Session " + S.n;
    return '<div class="top"><span class="count">' + label + " · " + (run.pos + 1) + " of " + n + '</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + run.pos + '"><i style="width:' + Math.round(100 * run.pos / n) + '%"></i></div></div>';
  }
  function tagFor(id) {
    var run = state.run;
    if (run.phase === "retry") return '<span class="tag">Second try</span>';
    if (I[id].tag) return '<span class="tag blue">' + esc(I[id].tag) + "</span>";
    if (run.sid === "s2" && sessOf(id) === "s1") return '<span class="tag blue">From Session 1</span>';
    if (run.sid === "s3" && sessOf(id) !== "s3") {
      var r = state.res[id];
      return r && !good(r.first) ? '<span class="tag">Back again: you missed this</span>' : '<span class="tag blue">Review</span>';
    }
    return "";
  }

  function spectrumHtml(opts) {
    /* opts: { clickable, placed: [[label, zone, cls]], mark: {zone: cls}, also: {zone: [labels]} } */
    var h = '<div class="spec"><div class="ends">' + (opts.hideEnds ? '<span class="blank">?</span><span class="blank">?</span>' : "<span>Collectivism</span><span>Individualism</span>") + '</div><div class="arrow" aria-hidden="true"></div>';
    h += SPEC_SVG;
    h += zonesHtml(SPEC.map(function (t) { return [t, ""]; }), "z4", opts) + "</div>";
    return h;
  }
  function chartHtml(opts) {
    var h = '<div class="spec"><div class="ends"><span>More equality</span><span>Less equality</span></div><div class="arrow" aria-hidden="true"></div>';
    h += zonesHtml(CHART, "z3", opts) + "</div>";
    return h;
  }
  function zonesHtml(Z, cls, o) {
    var h = '<div class="zones ' + cls + '" id="zones">';
    Z.forEach(function (z, i) {
      var tag = o.clickable ? "button" : "div";
      var who = "";
      (o.placed || []).forEach(function (p) { if (p[1] === i) who += "<span>" + esc(p[0]) + "</span>"; });
      ((o.also || {})[i] || []).forEach(function (a) { who += '<span class="also">' + esc(a) + "</span>"; });
      var mk = o.mark && o.mark[i] ? " " + o.mark[i] : "";
      h += "<" + tag + ' class="zone' + mk + '"' + (o.clickable ? ' type="button" data-z="' + i + '"' : "") + '><span class="zt">' + esc(z[0]) + "</span>" +
           (z[1] ? '<span class="zs">' + esc(z[1]) + "</span>" : "") + (who ? '<span class="who">' + who + "</span>" : "") + "</" + tag + ">";
    });
    return h + "</div>";
  }

  function renderCard() {
    var run = state.run, id = run.q[run.pos], it = I[id], c = run.c, h = topBar(), last = run.pos === run.q.length - 1;
    var tag = tagFor(id);
    h += '<div class="panel stack"><div class="row"><span class="source">' + esc(it.src) + "</span>" + tag + "</div>";
    if (it.stem) h += '<div class="stem">' + STEMS[it.stem] + "</div>";
    if (it.t === "read") h += "<h2>" + esc(it.title) + "</h2>" + it.html;
    else if (it.t === "place") {
      if (c.k >= it.names.length) h += '<p class="current">Here’s the finished picture.</p>';
      else {
        h += '<p class="muted small">' + esc(it.q) + " Tap a box. (" + (c.k + 1) + " of " + it.names.length + ")</p>";
        h += '<p class="current">Where does <b>' + esc(it.names[c.k][0]) + "</b> go?</p>";
      }
    } else h += '<p class="question">' + it.q + "</p>";
    h += "</div>";

    if (it.specFig) h += p19Html(!c.shown);
    if (it.t === "recall") {
      if (!c.shown) {
        h += '<p class="muted">Say your answer out loud or in your head first.</p><button class="primary" id="show" type="button">Show the answer</button>';
      } else {
        h += '<div class="result plain"><p>' + it.a + "</p>" + (it.fig !== undefined ? changeHtml(it.fig) : "") + "</div>";
        h += '<span class="lab" style="margin:0">How did you do?</span><div class="marks"><button class="m-got" id="m-got" type="button">Got it</button><button id="m-part" type="button">Partly</button><button class="m-miss" id="m-miss" type="button">Missed it</button></div>';
      }
    } else if (it.t === "mc") {
      if (!c.order) { c.order = shuffle(it.opts.map(function (o, k) { return k; })); save(); }
      if (!c.checked) h += '<p class="muted small">Think of the answer before you read the choices.</p>';
      h += '<div class="opts" id="opts">' + c.order.map(function (k, pos) {
        var cls = !c.checked ? "" : k === it.ans ? " is-right" : k === c.pick ? " is-wrong" : "";
        return '<button type="button" class="opt' + cls + '" data-o="' + k + '" aria-pressed="' + (!c.checked && c.pick === k) + '"' + (c.checked ? " disabled" : "") + "><b>" + "ABCD"[pos] + ".</b><span>" + esc(it.opts[k]) + "</span></button>";
      }).join("") + "</div>";
      if (!c.checked) h += '<button class="primary" id="check" type="button"' + (c.pick === null ? " disabled" : "") + ">Check</button>";
      else {
        var ok = c.pick === it.ans;
        h += '<div class="result ' + (ok ? "good" : "miss") + '"><p><strong>' + (ok ? "Right." : "Not this time.") + "</strong>" + (ok ? "" : " The answer is <b>" + "ABCD"[c.order.indexOf(it.ans)] + ". " + esc(it.opts[it.ans]) + "</b>.") + '</p><p class="why">' + it.why + "</p>" + (it.fig !== undefined ? changeHtml(it.fig) : "") + "</div>";
        h += '<button class="primary" id="next" type="button">' + (last ? "Finish" : "Next") + "</button>";
      }
    } else if (it.t === "place") {
      var done = c.k >= it.names.length, cur = it.names[Math.min(c.k, it.names.length - 1)], mark = {};
      if (c.zpick !== null && !done) { mark[cur[1]] = "right"; if (c.zpick !== cur[1]) mark[c.zpick] = "wrong"; }
      var o = { clickable: c.zpick === null && !done, placed: c.placed, mark: mark };
      h += it.layout === "chart" ? chartHtml(o) : spectrumHtml(o);
      if (c.zpick !== null && !done) {
        var okp = c.zpick === cur[1], Z = it.layout === "chart" ? CHART[cur[1]][0] : SPEC[cur[1]];
        h += '<div class="result ' + (okp ? "good" : "miss") + '"><p><strong>' + (okp ? "Right." : "Not quite.") + "</strong> " + esc(cur[0]) + " goes in <b>" + esc(Z) + '</b>.</p><p class="why">' + esc(cur[2]) + "</p></div>";
        h += '<button class="primary" id="nextname" type="button">' + (c.k === it.names.length - 1 ? "See the result" : "Next name") + "</button>";
      }
      if (done) {
        h += '<div class="result ' + (c.right === it.names.length ? "good" : "plain") + '"><p><strong>' + c.right + " of " + it.names.length + " right first time.</strong></p></div>";
        if (it.layout === "spec" && id === "s1-place") h += p19Html(false, "The same picture on page 19 of your package");
        h += '<button class="primary" id="next" type="button">' + (last ? "Finish" : "Next card") + "</button>";
      }
    } else if (it.t === "explain") {
      h += '<div><label class="lab" for="ta">Your answer</label><textarea id="ta" placeholder="Type it here, or say it out loud.">' + esc(c.text) + "</textarea></div>";
      if (!c.model) h += '<button class="primary" id="model" type="button">Show a model answer</button>';
      else {
        h += '<div class="result plain"><span class="lab">A model answer</span><p>' + esc(it.model) + "</p></div>";
        h += '<div class="panel stack"><span class="lab" style="margin:0">Tick what you got</span>' + it.checks.map(function (t, k) {
          return '<label class="check"><input type="checkbox" data-k="' + k + '"' + (c.ticks.indexOf(k) >= 0 ? " checked" : "") + "> <span>" + esc(t) + "</span></label>";
        }).join("") + "</div>";
        h += '<button class="primary" id="next" type="button">' + (last ? "Finish" : "Next") + "</button>";
      }
    } else if (it.t === "read") {
      h += '<button class="primary" id="next" type="button">' + (last ? "Finish" : "Got it") + "</button>";
    }
    h += '<button class="link" id="home" type="button">Back to the start (your place is saved)</button>';
    paint(h);

    on("home", function () { go("home"); });
    on("show", function () { c.shown = true; save(); render(); });
    ["got", "part", "miss"].forEach(function (r) { on("m-" + r, function () { record(id, r); advance(); }); });
    var opts = document.getElementById("opts");
    if (opts && !c.checked) opts.onclick = function (ev) {
      var b = ev.target.closest ? ev.target.closest("button") : null; if (!b) return;
      c.pick = parseInt(b.getAttribute("data-o"), 10); save(); render();
    };
    on("check", function () { if (c.pick === null) return; c.checked = true; record(id, c.pick === it.ans ? "right" : "wrong"); save(); render(); });
    var zones = document.getElementById("zones");
    if (zones && it.t === "place" && c.zpick === null && c.k < it.names.length) zones.onclick = function (ev) {
      var b = ev.target.closest ? ev.target.closest("button") : null; if (!b) return;
      var z = parseInt(b.getAttribute("data-z"), 10), cur = it.names[c.k];
      c.zpick = z; if (z === cur[1]) c.right++; else c.wrongNames = (c.wrongNames || []).concat([cur[0]]);
      save(); render();
    };
    on("nextname", function () {
      var cur = it.names[c.k]; c.placed.push([cur[0], cur[1]]); c.k++; c.zpick = null; save(); render();
      if (c.k >= it.names.length) window.scrollTo(0, 0);
    });
    var ta = document.getElementById("ta");
    if (ta) ta.oninput = function () { c.text = ta.value; save(); };
    on("model", function () { c.model = true; save(); render(); });
    Array.prototype.forEach.call(document.querySelectorAll(".check input"), function (box) {
      box.onchange = function () {
        var k = parseInt(box.getAttribute("data-k"), 10), at = c.ticks.indexOf(k);
        if (box.checked && at < 0) c.ticks.push(k); else if (!box.checked && at >= 0) c.ticks.splice(at, 1);
        save();
      };
    });
    on("next", function () {
      if (it.t === "place") record(id, c.right === it.names.length ? "got" : "part", { score: c.right + "/" + it.names.length, wrongNames: c.wrongNames || [] });
      else if (it.t === "explain") { state.notes[id] = c.text; record(id, c.ticks.length === it.checks.length ? "got" : c.ticks.length ? "part" : "miss", { ticks: c.ticks.length + "/" + it.checks.length }); }
      else if (it.t === "read") record(id, "got");
      advance();
    });
  }

  function renderDone() {
    var run = state.run, S = sessById(run.sid), d = state.done[run.sid], h = "", nx = nextSid();
    if (run.phase === "extra") {
      h += '<p class="source">Social 30-1 · Test #3</p><h1>That’s the extra three.</h1><p>Nice. That’s plenty for now.</p>';
    } else {
      h += '<p class="source">Social 30-1 · Test #3</p><h1>Session ' + S.n + " done.</h1>";
      h += '<div class="stats"><div class="stat"><b>' + d.first + " of " + d.n + '</b><span>right first time</span></div><div class="stat"><b>' + d.mins + '</b><span>' + (d.mins === 1 ? "minute" : "minutes") + "</span></div></div>";
      var line = S.id === "s1" || S.id === "s2" ? "Anything you missed comes back in Session 3." :
                 S.id === "s3" ? "That’s Friday covered. Read the summary Thursday night. Session 4 is for next week’s source analysis." :
                 "That’s the practice for next week’s source analysis.";
      h += "<p>" + line + "</p>";
    }
    if (nx === "s4" && run.sid !== "s4") {
      h += '<button class="primary" id="tosum" type="button">Open the Thursday-night summary</button>';
      h += '<button class="link" id="home" type="button">Back to the start</button>';
    } else if (nx) {
      h += '<p class="muted">Next time: Session ' + sessById(nx).n + ", " + esc(sessById(nx).name.toLowerCase()) + ".</p>";
      h += '<button class="primary" id="home" type="button">Done for now</button>';
    } else {
      h += '<button class="primary" id="tosum" type="button">Open the Thursday-night summary</button>';
      h += '<button class="link" id="home" type="button">Back to the start</button>';
    }
    if (run.phase !== "extra" && extraQueue().length) h += '<button class="ghost" id="extra" type="button">Three more cards (optional)</button>';
    paint(h);
    on("tosum", function () { go("summary"); });
    on("extra", startExtra);
    on("home", function () { go("home"); });
  }

  function renderSummary() {
    var h = '<p class="source">Social 30-1 · Test #3 · Thursday night</p><h1>The whole test on one page</h1>';
    h += '<p class="muted small">Read it once, slowly. Then cover each box and say what’s in it.</p>';
    h += '<div class="panel stack"><h2>The page 19 spectrum</h2>' + p19Html(false) +
      '<p class="small"><b>Add from the chart and slides:</b> Tommy Douglas with democratic socialism. Keynes and FDR with modern liberalism. Hayek and Friedman on the classical liberal side.</p>' +
      '<p class="small muted">The terminology chart puts Owen, Douglas and democratic socialism in its middle (mixed economy) column. Same idea: right of Marx, left of Smith.</p>' +
      changeHtml(-1) + '<p class="small"><b>Change spectrum:</b> Marx is <b>radical</b> (violence, forward). Luddites are <b>reactionary</b> (violence, back). Burke is <b>conservative</b> (status quo, slow organic change, elitist).</p></div>';
    h += '<div class="panel stack"><h2>Don’t mix these up</h2><ul class="plain small">' +
      "<li><b>Radical vs reactionary.</b> Both may use violence. Radical goes forward to something new (Marx). Reactionary goes back to the old ways (Luddites).</li>" +
      "<li><b>Square Deal vs New Deal.</b> Teddy Roosevelt, 1902 coal strike, business and labour getting along. FDR, 1930s, government programs in the Depression.</li>" +
      "<li><b>Welfare capitalism vs democratic socialism.</b> Business owners add pensions and shorter hours (partly to stop unions). The government builds a welfare state with taxes.</li>" +
      "<li><b>Utopian vs Marxist socialism.</b> Owen improved conditions inside his own business. Marx wanted a violent revolution and no private property.</li>" +
      "<li><b>Chartists vs Factory Acts.</b> Chartists wanted the vote (men over 21, secret ballot). The Factory Acts set working hours and child-labour ages.</li>" +
      "<li><b>Classical conservatism vs classical liberalism.</b> Elite rule, limited vote, tradition. Individual rights, free market, small government.</li></ul></div>";
    h += '<div class="panel stack"><h2>The economic chart, short version</h2><div class="cols">' +
      '<div class="col"><b>Communism · command economy</b>Classless society, economic equality, collectivism, nationalization, Gosplan, five-year plans, proletariat vs bourgeoisie.</div>' +
      '<div class="col"><b>Modern liberalism · mixed economy</b>Democratic socialism, redistribution of wealth, progressive taxation, safety nets, welfare state, welfare capitalism, cradle to grave, stimulus packages, UBI, Occupy.</div>' +
      '<div class="col"><b>Classical liberalism · free market</b>Laissez-faire, invisible hand, self-interest, competition, social Darwinism, trickle down, supply-side, tax breaks.</div></div></div>';
    h += '<div class="panel stack"><h2>Dates and numbers</h2><table><tbody>' +
      "<tr><td>1838</td><td>People’s Charter (Chartists, 1838 to 1857)</td></tr>" +
      "<tr><td>1902</td><td>Coal strike: Teddy Roosevelt’s Square Deal</td></tr>" +
      "<tr><td>1918</td><td>Women vote in Canada</td></tr>" +
      "<tr><td>1919</td><td>International Labour Organization</td></tr>" +
      "<tr><td>1920</td><td>19th Amendment: American women vote</td></tr>" +
      "<tr><td>1944</td><td>CCF wins Saskatchewan (NDP from 1961)</td></tr>" +
      "<tr><td>1960</td><td>Indigenous people vote in Canada</td></tr>" +
      "<tr><td>2011</td><td>Occupy Wall Street: “We are the 99%”</td></tr>" +
      "<tr><td>10 h</td><td>Factory Acts: 10-hour day, 56½ hours a week</td></tr>" +
      "</tbody></table></div>";
    h += '<div class="panel stack"><h2>For next week’s source analysis</h2><ol class="plain">' +
      "<li>Call the rich–poor gap <b>economic disparity</b>.</li>" +
      "<li>Use <b>economic</b> thinkers (Smith, Marx, Owen, Keynes, Friedman, Hayek, Douglas), and talk about the <b>ideology</b>, not a party.</li>" +
      "<li>Every supporter or opponent gets a reason that <b>points back to the source</b>.</li></ol></div>";
    h += '<button class="primary" id="home" type="button">Back to the start</button>';
    paint(h);
    on("home", function () { go("home"); });
  }

  function logText() {
    var L = ["# Social 30-1 Test #3 review: log", "", "## Sessions"];
    SESS.forEach(function (S) {
      var d = state.done[S.id];
      L.push("- Session " + S.n + " (" + S.name + "): " + (d ? stamp(d.at) + ", " + d.first + " of " + d.n + " right first time, about " + d.mins + " min" : "not done"));
    });
    var miss = [], place = [], notes = [];
    Object.keys(I).forEach(function (id) {
      var r = state.res[id]; if (!r) return;
      if (scored(id) && !good(r.first)) miss.push("- " + I[id].k + " (" + r.first + (good(r.last) ? ", right later" : "") + ")");
      if (I[id].t === "place") place.push("- " + I[id].k + ": " + (r.score || "") + (r.wrongNames && r.wrongNames.length ? ", missed " + r.wrongNames.join(", ") : ""));
      if (I[id].t === "explain") notes.push("- " + I[id].k + " (ticked " + (r.ticks || "?") + "): " + (state.notes[id] ? state.notes[id].replace(/\s+/g, " ") : "(nothing typed)"));
    });
    L.push("", "## Missed the first time"); L.push(miss.length ? miss.join("\n") : "- none");
    if (place.length) { L.push("", "## Spectrum and chart"); L.push(place.join("\n")); }
    if (notes.length) { L.push("", "## Written answers"); L.push(notes.join("\n")); }
    return L.join("\n");
  }
  function copyLog() {
    var text = logText();
    var done = function (msg) { state.copied = msg; render(); var ta = document.getElementById("logbox"); if (ta && msg.indexOf("Select") === 0) { ta.focus(); ta.select(); } };
    try {
      navigator.clipboard.writeText(text).then(function () { done("Copied. Paste it into a message or a note."); }, function () { done("Select the text below and copy it."); });
    } catch (x) { done("Select the text below and copy it."); }
  }
  function renderLog() {
    var h = '<p class="source">Social 30-1 · your log</p><h1>What you’ve done</h1>';
    h += '<button class="primary" id="home" type="button">Back to the start</button>';
    h += '<button class="ghost" id="copy" type="button">Copy my log</button>';
    if (state.copied) h += '<p class="muted" role="status">' + esc(state.copied) + "</p>";
    h += '<textarea class="log" id="logbox" readonly aria-label="Your log">' + esc(logText()) + "</textarea>";
    h += '<p class="muted small">Nothing is sent anywhere. The log only leaves this phone if you copy it and send it to someone.</p>';
    h += state.confirmReset
      ? '<div class="row"><span>Clear everything and start fresh?</span><button class="ghost" id="yes" type="button">Yes, clear</button><button class="ghost" id="no" type="button">Keep it</button></div>'
      : '<button class="link" id="reset" type="button">Start over</button>';
    paint(h);
    on("home", function () { go("home"); }); on("copy", copyLog);
    on("reset", function () { state.confirmReset = true; render(); });
    on("no", function () { state.confirmReset = false; render(); });
    on("yes", function () { state = fresh(); save(); render(); window.scrollTo(0, 0); });
  }

  load();
  render();
})();
</script>
</body>
</html>
